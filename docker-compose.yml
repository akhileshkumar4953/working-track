
services:
  mysql:
    image: mysql:8.0
    container_name: task_track-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_track

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  backend:
    build: ./task-track
    container_name: task_track-app
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/task_track
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8080:8080"


  frontend:
    build: ./task_track-ui
    container_name: task_track-frontend

    depends_on:
      - backend

    ports:
      - "4200:80"


volumes:
  mysql_data: