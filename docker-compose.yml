version: '3.8'

services:

  mysql:

    image: mysql:8.0

    container_name: workingtrack-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: working_track

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  working_track:

    build: .

    container_name: workingtrack-app

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/working_track
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql_data: